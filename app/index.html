<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0F4C47" />
    <title>Fenster</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../design/tokens.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Phone: top bar + content + bottom tabs. Desktop (≥ 900px): sidebar + centred content. -->
    <div class="app" id="device">
      <aside class="sidebar" id="sidebar" aria-label="Fenster"></aside>
      <div class="main">
        <header class="topbar" id="topbar"></header>
        <main class="view" id="view" tabindex="-1"></main>
        <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
      </div>
    </div>

    <script src="i18n.js"></script>
    <script src="app.js"></script>
  </body>
</html>
